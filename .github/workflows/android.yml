name: Build SmartHome APK

on:
  push:
    branches:
      - smart-home-launcher-build-20260829
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct source
        run: |
          cat SmartHomeSource.b64.part00 SmartHomeSource.b64.part01 SmartHomeSource.b64.part02 | base64 --decode > SmartHomeSource.zip
          mkdir -p smarthome
          unzip -q SmartHomeSource.zip -d smarthome

      - name: Build APK
        run: cd smarthome && gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp smarthome/app/build/outputs/apk/debug/app-debug.apk SmartHome-1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SmartHome-APK
          path: SmartHome-1.0.0.apk
          if-no-files-found: error
